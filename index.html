<style>
:root{--bg:#f3f4f2;--c:#fff;--t:#16201e;--m:#68736f;--p:#0f766e;--r:#c62828;--g:#2e7d32;--b:#dde2df;--w:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0e1413;--c:#18211f;--t:#e8efed;--m:#91a09b;--b:#2a3532;--p:#2dd4bf}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,sans-serif;padding-bottom:70px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;position:sticky;top:0;background:var(--bg);z-index:5}
header b{font-size:17px}main{padding:0 12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:0 0 10px}
.m{color:var(--m);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button,select,input{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 10px}
input,select{width:100%;margin:3px 0 8px}button{cursor:pointer}.pb{background:var(--p);color:#fff;border-color:var(--p)}
.sm{padding:5px 9px;font-size:13px}.bd{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--b)}
.Cancelled,.Refund{color:var(--r);border-color:var(--r)}.Delivered{color:var(--g);border-color:var(--g)}
.big{font-size:22px;font-weight:700}h3{margin:16px 2px 8px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;font-size:13px}nav .on{color:var(--p);font-weight:700;box-shadow:inset 0 3px var(--p)}
dialog{width:min(94vw,440px);border:1px solid var(--b);border-radius:14px;background:var(--bg);color:var(--t);max-height:90vh}
.c{text-align:center;padding:60px 20px}.neg{color:var(--r)}.pos{color:var(--g)}[hidden]{display:none!important}
#pr{display:none}
@media print{body{background:#fff;padding:0}body>*:not(#pr){display:none!important}#pr{display:block!important;background:#fff;color:#000;padding:12px;font-size:13px}
#pr h2{margin:0 0 4px}#pr .pm{color:#444;margin-bottom:10px}#pr table{width:100%;border-collapse:collapse}#pr th,#pr td{border:1px solid #999;padding:5px 7px;text-align:left}#pr thead th,#pr tfoot th{background:#eee}#pr thead{display:table-header-group}#pr tr{page-break-inside:avoid}}
</style>

<body>
<section id="login" class="c" hidden><h2>Card Ledger</h2><p class="m">Only for invited people</p><button class="pb" onclick="login()">Sign in with Google</button></section>
<section id="deny" class="c" hidden><h2>Access Denied</h2><p>This email is not on the allowed list:<br><b id="denyMail"></b></p><button onclick="logout()">Logout</button></section>
<div id="main" hidden>
<header><b id="hi"></b><button class="sm" onclick="logout()">Logout</button></header>
<main id="app"></main>
<nav><button data-t="c" onclick="go('c')">Cards & Split</button><button data-t="s" onclick="go('s')">Statement</button><button data-t="f" onclick="go('f')">My Salary & Savings</button><button data-t="a" id="adminBtn" onclick="go('a')" hidden>Manage Friends</button></nav>
</div>
<dialog id="d"></dialog>
<div id="pr"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,query,where,onSnapshot,serverTimestamp,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== CONFIG: Enter your Firebase config and Admin Gmail here ===== */
const cfg={apiKey:"AIzaSyBY05UdaTavfUsUm-HDZ3YkWigv4GeHgLY",authDomain:"expense-tracker-16823.firebaseapp.com",projectId:"expense-tracker-16823",storageBucket:"expense-tracker-16823.firebasestorage.app",messagingSenderId:"1064956551398",appId:"1:1064956551398:web:bed8f5a69ef2c1e8249b27"};
const ADMIN="deepakmakandipur@gmail.com";
/* ================================================================ */

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
const S={me:null,users:[],cards:[],orders:[],fin:[],allowed:[],tab:'c',show:false,q:'',sc:'',sm:'',stv:'',_st:0,month:today().slice(0,7),cardF:''};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const isG=id=>String(id).startsWith('g:');
const nm=id=>isG(id)?id.slice(2)+' (private)':(S.users.find(u=>u.uid===id)?.name||'?');
const STAT={Ordered:'Ordered',Delivered:'Delivered',Cancelled:'Cancelled / Return (Refund Pending)','Refund Received':'Refund Received'};
const dead=o=>o.status==='Cancelled'||o.status==='Refund Received';
const cb=o=>dead(o)?0:(o.cbType==='%'?o.paid*o.cbVal/100:+o.cbVal||0);
const eff=o=>(o.cbMode==='instant'||o.cbCredited)?cb(o):0;
const chgRaw=o=>(o.fee||0)+(o.feeGst||0)+(o.intr||0);
const chg=o=>o.chgBy==='payer'?0:chgRaw(o);
const psum=o=>(o.pays||[]).reduce((s,p)=>s+p.amt,0);
const owed=o=>o.status==='Refund Received'?(o.dedBy==='payer'?0:Math.max(0,o.paid-(o.refundAmt??o.paid))+(o.clawAmt||0)):o.status==='Cancelled'?o.paid:o.paid-eff(o)+chg(o);
const mo=o=>o.emiMonths||1;
const sch=o=>Array.isArray(o.sched)&&mo(o)>1&&o.sched.length===mo(o)?o.sched:null;
const rd=x=>Math.round(x*100)/100,rowT=r=>(r.prin||0)+(r.int||0)+(r.fee||0)+(r.gst||0);
const pend=o=>dead(o)?Math.abs(owed(o)-psum(o))>0.5:(o.emiDone||0)<mo(o);
const addC=(c,n)=>{const[y,m]=c.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const cyc=(dt,day)=>{const d=new Date(dt);return addC(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),d.getDate()>day?1:0)};
const show=id=>['login','deny','main'].forEach(x=>$('#'+x).hidden=x!==id);

window.login=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert(e.message));
window.logout=()=>signOut(auth);
window.go=t=>{S.tab=t;render()};
window.closeD=()=>$('#d').close();
const dlg=h=>{$('#d').innerHTML=h;$('#d').showModal();if($('#oe')){if(window._eo)emiOpen(window._eo);else{window._er=null;emiCalc(0)}}};

onAuthStateChanged(auth,async u=>{
  if(!u){show('login');return}
  const em=(u.email||'').toLowerCase(),admin=em===ADMIN.toLowerCase();let ok=u.emailVerified,name=u.displayName||em;
  if(ok&&!admin){try{const a=await getDoc(doc(db,'allowed_users',em));ok=a.exists()&&a.data().active===true;if(ok)name=a.data().name}catch{ok=false}}
  if(!ok){$('#denyMail').textContent=em;show('deny');return}
  S.me={uid:u.uid,email:em,name,admin};
  await setDoc(doc(db,'users',u.uid),{uid:u.uid,name,email:em});
  $('#hi').textContent=name;$('#adminBtn').hidden=!admin;show('main');start();
});

function start(){
  const e=x=>console.error(x),m=S.me.uid;
  onSnapshot(collection(db,'users'),s=>{S.users=s.docs.map(d=>d.data());render(1)},e);
  onSnapshot(collection(db,'cards'),s=>{S.cards=s.docs.map(d=>({id:d.id,...d.data()}));render(1)},e);
  onSnapshot(query(collection(db,'orders'),where('participants','array-contains',m)),s=>{S.orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));render(1)},e);
  onSnapshot(collection(db,'users',m,'finance'),s=>{S.fin=s.docs.map(d=>({id:d.id,...d.data()}));render(1)},e);
  if(S.me.admin)onSnapshot(collection(db,'allowed_users'),s=>{S.allowed=s.docs.map(d=>d.data());render(1)},e);
}

function render(k){
  if(!S.me)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  const keep={},ae=document.activeElement,aid=ae&&ae.id;
  if(k===1)document.querySelectorAll('#app [id]').forEach(e=>{if('value' in e)keep[e.id]=e.value});
  $('#app').innerHTML=S.tab==='c'?vCards():S.tab==='s'?vStmt():S.tab==='f'?vFin():vAdmin();
  if(k===1){for(const id in keep){const e=document.getElementById(id);if(e&&e.value!==keep[id])e.value=keep[id]}
    if(aid&&keep[aid]!==undefined){const e=document.getElementById(aid);if(e){e.focus();try{e.setSelectionRange(ae.selectionStart,ae.selectionEnd)}catch{}}}}
}

/* ---------- Tab 1: Cards & Split ---------- */
function vCards(){
  const me=S.me.uid,G={};
  S.orders.filter(o=>o.paidBy!==o.boughtFor&&pend(o)).forEach(o=>{const k=[o.cardId,due(o),o.paidBy,o.boughtFor].join('|');(G[k]=G[k]||[]).push(o)});
  const td=new Date();td.setHours(0,0,0,0);
  const mk=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');
  const nx=d=>{const f=(y,m)=>new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()));let x=f(td.getFullYear(),td.getMonth());if(x<td)x=f(td.getFullYear(),td.getMonth()+1);return x};
  let banner='';
  [...new Set(Object.values(G).map(a=>a[0].cardId))].forEach(cid=>{const c=S.cards.find(x=>x.id===cid);if(!c)return;const n=nx(c.stmtDay),days=Math.round((n-td)/864e5);if(days>5)return;
    let give=0,get=0;Object.values(G).forEach(a=>{const o=a[0];if(o.cardId!==cid||due(o)!==mk(n))return;const t=a.reduce((s,x)=>s+due1(x),0);((o.boughtFor===me)===(t>=0))?give+=Math.abs(t):get+=Math.abs(t)});
    if(give||get)banner+=`<div class="card" style="border-color:var(--w)">⏰ ${esc(c.name)} bill due ${days===0?'today':'in '+days+' days'} (day ${c.stmtDay})${give?`<br>You owe: <b>${R(give)}</b>`:''}${get?`<br>You get: <b>${R(get)}</b>`:''}</div>`});
  const groups=Object.values(G).map(a=>{
    const o=a[0],t=Math.round(a.reduce((s,x)=>s+due1(x),0)*100)/100,iOwe=(o.boughtFor===me)===(t>=0),at=Math.abs(t),oth=o.paidBy===me?o.boughtFor:o.paidBy,dc=due(o);
    const txt=`${o.cardName} – before the ${o.stmtDay}th bill (${dc}): ${nm(oth)} – ${iOwe?'pay '+R(at):'receive '+R(at)}${t<0?' (refund returned)':''}`;
    const wa=encodeURIComponent(`Ledger – ${o.cardName} (${dc} bill)\n`+a.map(x=>`• ${x.item}${mo(x)>1?` (EMI ${(x.emiDone||0)+1}/${mo(x)})`:''}: ${R(due1(x))}`).join('\n')+`\nTotal: ${R(at)}`);
    return `<div class="card"><div>${esc(txt)}</div><div class="m">${a.length} order${a.length===1?'':'s'}</div><div class="row" style="margin-top:8px">
      <button class="pb sm" onclick="payGroup('${a.map(x=>x.id).join(',')}',${t},true)">Settle Cycle</button>
      <button class="sm" onclick="payGroup('${a.map(x=>x.id).join(',')}',${t})">Partial payment</button>
      <a href="https://wa.me/?text=${wa}" target="_blank" rel="noopener"><button class="sm">Share on WhatsApp</button></a></div></div>`;
  }).join('')||'<p class="m">No dues</p>';
  const pcb=S.orders.filter(o=>o.paidBy===me&&o.cbMode==='later'&&!o.cbCredited&&!dead(o)).reduce((s,o)=>s+cb(o),0);
  const myCards=S.cards.filter(c=>c.ownerUid===me);
  return `<div class="row" style="margin-bottom:10px"><button class="pb" onclick="orderForm()">+ New order</button><button onclick="cardForm()">+ Card</button><button onclick="chargeForm()">+ Bank charge</button></div>
  <div class="card"><div class="m">Upcoming cashback (not credited yet)</div><div class="big">${R(pcb)}</div>
</div>
  <h3>My cards</h3>${myCards.map(c=>`<div class="card"><div class="row sp"><span><b>${esc(c.name)}</b> ${c.active===false?'<span class="bd neg">Inactive</span>':''}<br><span class="m">Statement Date ${c.stmtDay} • ${S.orders.filter(o=>o.cardId===c.id).length} orders</span></span></div>
  <div class="row" style="margin-top:8px"><button class="sm" onclick="cardEdit('${c.id}')">Edit</button><button class="sm" onclick="cardTog('${c.id}',${c.active===false})">${c.active===false?'Reactivate':'Discontinue'}</button><button class="sm neg" onclick="cardDel('${c.id}')">Delete</button></div></div>`).join('')||'<p class="m">No cards yet</p>'}
  ${banner}<h3>Billing Cycle Settlement</h3>${groups}
  <h3>Order history</h3>
  <select onchange="S.cardF=this.value;render()"><option value="">All cards</option>${S.cards.filter(c=>S.orders.some(o=>o.cardId===c.id)).map(c=>`<option value="${c.id}" ${S.cardF===c.id?'selected':''}>${esc(c.name)} – ${esc(nm(c.ownerUid))}</option>`).join('')}</select>
  <input placeholder="🔍 Search item, card or friend" value="${esc(S.q)}" oninput="setQ(this.value)"><div id="hist">${hist()}</div>`;
}
const instAt=(o,k)=>{if(dead(o))return owed(o);const s=sch(o);if(!s||!s[k])return owed(o)/mo(o);const r=s[k];return (r.prin||0)+(o.chgBy==='payer'?0:(r.int||0)+(r.fee||0)+(r.gst||0))-eff(o)/mo(o)};
const inst=o=>instAt(o,o.emiDone||0);
const due1=o=>dead(o)?owed(o)-psum(o):inst(o)-(o.credit||0);
const hist=()=>{const q=(S.q||'').toLowerCase();return S.orders.filter(o=>(!S.cardF||o.cardId===S.cardF)&&(!q||[o.item,o.cardName,o.platform,nm(o.paidBy),nm(o.boughtFor)].join(' ').toLowerCase().includes(q))).map(oCard).join('')||'<p class="m">No orders</p>'};
window.setQ=v=>{S.q=v;$('#hist').innerHTML=hist()};
const mdiff=(a,b)=>{const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return(y1-y2)*12+(m1-m2)};
const share=(o,m)=>{if(!o.date)return 0;const i=mdiff(m,o.date.slice(0,7));if(dead(o))return o.status==='Refund Received'&&i===0?owed(o):0;return i>=0&&i<mo(o)?instAt(o,i):0};
const due=o=>dead(o)?o.cycle:addC(o.cycle,o.emiDone||0);
window.S=S;window.render=render;

function oCard(o){
  const sv=(o.normal||0)-o.paid,badge=o.status==='Refund Received'?'Refund':o.status;
  const canCb=o.paidBy===S.me.uid&&o.cbMode==='later'&&!o.cbCredited&&!dead(o)&&cb(o)>0;
  return `<div class="card" ${dead(o)?'style="opacity:.8"':''}><div class="row sp"><b>${esc(o.item)}</b><span class="bd ${badge}">${STAT[o.status]}</span></div>
  <div class="m">${esc(o.platform)} • ${esc(o.cardName)} • ${o.date}<br>${esc(nm(o.paidBy))}'s card → for ${esc(nm(o.boughtFor))}</div>
  <div>Charged to card: <b>${R(o.paid)}</b>${sv>0?` <span class="pos">• Prime/Offer Savings ${R(sv)}</span>`:''}</div>
  <div class="m">Due: ${R(dead(o)?due1(o):owed(o))}${mo(o)>1?` • EMI ${o.emiDone||0}/${mo(o)} paid (${R(inst(o))}/month)`:''}${chgRaw(o)>0?` • EMI/Bank charge ${R(chgRaw(o))} (${o.chgBy==='payer'?'Card owner pays':'Buyer pays'})`:''}${o.status==='Refund Received'?` • Refund ${R(o.refundAmt??o.paid)}, Deduction ${R(Math.max(0,o.paid-(o.refundAmt??o.paid))+(o.clawAmt||0))} (${o.dedBy==='payer'?'Card owner pays':'Buyer pays'})`:o.status==='Cancelled'?' • Awaiting refund':''}${o.credit?` • Partially received ${R(o.credit)}`:''}${cb(o)?` • Cashback ${R(cb(o))} ${eff(o)?'(deducted)':'(pending)'}`:''}${o.paidBy!==o.boughtFor&&!pend(o)?(dead(o)?' • No dues':' • Settled ✓'):''}</div>
  <div class="row" style="margin-top:6px"><select style="width:auto;margin:0" onchange="setSt('${o.id}',this.value)">${Object.keys(STAT).map(k=>`<option value="${k}" ${o.status===k?'selected':''}>${STAT[k]}</option>`).join('')}</select>
  ${canCb?`<button class="sm" onclick="cbDone('${o.id}')">Mark Cashback Credited</button>`:''}<button class="sm" onclick="editForm('${o.id}')">Edit</button>${canDel(o)?`<button class="sm neg" onclick="delOrder('${o.id}')">Delete</button>`:''}</div></div>`;
}
const canDel=o=>o.createdBy===S.me.uid&&o.status!=='Refund Received'&&!(o.pays&&o.pays.length);
window.delOrder=async id=>{const o=S.orders.find(x=>x.id===id);
  if(!o||!canDel(o))return alert('This order cannot be deleted. Cancel it instead.');
  if(!confirm('"'+o.item+'" Delete permanently?\nThis will change the dues and the statement total.'))return;
  try{await deleteDoc(doc(db,'orders',id))}catch(e){alert('Could not delete: '+e.message)}};
window.setSt=(id,v)=>v==='Refund Received'?refundForm(id):updateDoc(doc(db,'orders',id),{status:v});
window.refundForm=id=>{const o=S.orders.find(x=>x.id===id);dlg(`<h3>Refund details – ${esc(o.item)}</h3><div class="m">Charged to card: ${R(o.paid)}</div>
  <select id="rfT" onchange="$('#rfP').hidden=this.value==='full'"><option value="full">Full refund received</option><option value="part">Partial refund received</option></select>
  <div id="rfP" hidden>Amount received in refund (₹)<input id="rfA" type="number" inputmode="decimal"></div>
  Refund date<input id="rfD" type="date" value="${today()}">
  If cashback was clawed back (₹, optional)<input id="rfC" type="number" inputmode="decimal">
  <div class="m">Who pays the deduction (if any)?</div>
  <select id="rfB"><option value="buyer">Bought for (me, in my own orders)</option><option value="payer">Card owner themselves</option></select>
  <div class="row"><button class="pb" onclick="saveRefund('${id}')">Save</button><button onclick="closeD();render()">Cancel</button></div>`)};
window.saveRefund=async id=>{const o=S.orders.find(x=>x.id===id),g=i=>$('#'+i).value,part=g('rfT')==='part';
  const r=part?+g('rfA'):o.paid;if(part&&(!(g('rfA')!=='')||r<0||r>o.paid))return alert('Refund amount must be between 0 and '+o.paid+'');
  await updateDoc(doc(db,'orders',id),{status:'Refund Received',refundAmt:r,rfDate:g('rfD'),clawAmt:+g('rfC')||0,dedBy:g('rfB')});closeD()};
window.cbDone=id=>updateDoc(doc(db,'orders',id),{cbCredited:true});
window.payGroup=async(ids,tot,full)=>{
  let a=tot;if(!full&&tot>0){a=+prompt('How much was received/paid? (full: '+tot+')',tot);if(!(a>0))return;a=Math.min(a,tot)}else full=true;
  const dt=today(),bt=writeBatch(db);let n=0;
  for(const i of ids.split(',')){const o=S.orders.find(x=>x.id===i),need=due1(o),use=full?need:Math.min(a,Math.max(need,0));
    if(Math.abs(use)<0.005)continue;if(!full)a-=use;
    const pays=[...(o.pays||[]),{amt:Math.round(use*100)/100,date:dt}],r=doc(db,'orders',i);n++;
    if(dead(o)){bt.update(r,{pays,settled:Math.abs(owed(o)-psum(o)-use)<0.5});continue}
    const c=(o.credit||0)+use,ok=c>=inst(o)-0.5,k=(o.emiDone||0)+(ok?1:0);
    bt.update(r,{credit:ok?0:c,emiDone:k,settled:k>=mo(o),pays})}
  if(n)try{await bt.commit()}catch(e){alert('Not saved: '+e.message)}};
window.chargeForm=()=>{
  const guests=[...new Set(S.orders.filter(o=>isG(o.boughtFor)).map(o=>o.boughtFor.slice(2)))];
  dlg(`<h3>Add bank charge</h3>Card<select id="hc">${S.cards.filter(c=>c.ownerUid===S.me.uid).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
  Charge type<select id="ht"><option>Late fee</option><option>Annual fee</option><option>Interest</option><option>GST</option><option>Processing fee</option><option>Other bank charges</option></select>
  Amount (₹)<input id="ha" type="number" inputmode="decimal">Description (optional)<input id="hn">
  In whose account<select id="hb" onchange="$('#hgw').hidden=this.value!=='__g'"><option value="${S.me.uid}">Me (self)</option>${S.users.filter(u=>u.uid!==S.me.uid).map(u=>`<option value="${u.uid}">${esc(u.name)}</option>`).join('')}<option value="__g">Other friend (only in my records)</option></select>
  <div id="hgw" hidden>Friend's name<input id="hg" list="hgl"><datalist id="hgl">${guests.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>
  Date<input id="hd" type="date" value="${today()}">
  <div class="row"><button class="pb" onclick="saveCharge()">Save</button><button onclick="closeD()">Cancel</button></div>`)};
window.saveCharge=async()=>{const g=i=>$('#'+i).value,c=S.cards.find(x=>x.id===g('hc')),amt=+g('ha');
  if(!c||!(amt>0))return alert('Enter card and amount');
  let bf=g('hb');if(bf==='__g'){const n=g('hg').trim();if(!n)return alert("Enter the friend's name");bf='g:'+n}
  const t=g('ht'),nt=g('hn').trim(),dt=g('hd');
  await addDoc(collection(db,'orders'),{kind:'charge',item:nt?t+' – '+nt:t,platform:'Bank',cardId:c.id,cardName:c.name,stmtDay:c.stmtDay,paidBy:S.me.uid,boughtFor:bf,
    participants:[...new Set([S.me.uid,bf].filter(x=>!isG(x)))],normal:amt,paid:amt,cbType:'₹',cbVal:0,cbMode:'instant',cbCredited:false,status:'Ordered',emiMonths:0,emiDone:0,settled:false,date:dt,cycle:cyc(dt,c.stmtDay),createdBy:S.me.uid,ts:serverTimestamp()});closeD()};
window.cardEdit=id=>{const c=S.cards.find(x=>x.id===id);dlg(`<h3>Edit card</h3>Card name<input id="cn" value="${esc(c.name)}">Statement Date (day of every month)<input id="cd" type="number" min="1" max="31" value="${c.stmtDay}">
  <div class="m">The new date applies only to future new orders. Old orders stay in their old bills so past statement matching is not disturbed.</div>
  <div class="row" style="margin-top:8px"><button class="pb" onclick="cardSave('${id}')">Save</button><button onclick="closeD()">Cancel</button></div>`)};
window.cardSave=async id=>{const n=$('#cn').value.trim(),d=+$('#cd').value;if(!n||d<1||d>31)return alert('Enter a name and a valid date');
  await updateDoc(doc(db,'cards',id),{name:n,stmtDay:d});
  for(const o of S.orders.filter(x=>x.cardId===id&&x.cardName!==n))await updateDoc(doc(db,'orders',o.id),{cardName:n});closeD()};
window.cardTog=(id,act)=>{if(!act&&!confirm('Discontinue this card? It will not show in new orders, but old history and statements will remain.'))return;return updateDoc(doc(db,'cards',id),{active:act})};
window.cardDel=async id=>{const n=S.orders.filter(o=>o.cardId===id).length;
  if(n)return alert('This card has '+n+' orders recorded, so it cannot be deleted. "Discontinue" instead; it keeps history and statements intact.');
  if(confirm('Delete this card permanently?'))await deleteDoc(doc(db,'cards',id))};
window.cardForm=()=>dlg(`<h3>New card</h3>Card name (no number/CVV)<input id="cn" placeholder="Amazon Pay ICICI">Statement Date (day of every month)<input id="cd" type="number" min="1" max="31" placeholder="15">
<div class="row"><button class="pb" onclick="saveCard()">Save</button><button onclick="closeD()">Cancel</button></div>`);
window.saveCard=async()=>{const n=$('#cn').value.trim(),d=+$('#cd').value;if(!n||d<1||d>31)return alert('Enter a name and a valid date');

const TERMS=[3,6,9,12,18,24];
window.emiRows=(P,n,rate,fee)=>{const r=rate/1200,e=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n;let b=P;const rows=[];
  for(let i=0;i<n;i++){const it=b*r,pr=e-it;b-=pr;rows.push({prin:rd(pr),int:rd(it),fee:i?0:rd(fee),gst:rd((it+(i?0:fee))*0.18)})}
  rows[n-1].prin=rd(rows[n-1].prin+P-rows.reduce((a,x)=>a+x.prin,0));return rows};
window.emiBlock=o=>{const m=o&&o.emiMonths>1?o.emiMonths:0,T=[...new Set([...TERMS,...(m?[m]:[])])].sort((a,b)=>a-b);

window.emiRead=()=>{const n=+$('#oe').value,rows=[];for(let i=0;i<n;i++){const v=k=>+($('#e'+k+i)||{}).value||0;rows.push({prin:v('p'),int:v('i'),fee:v('f'),gst:v('g')})}return rows};
window.emiCalc=f=>{const n=+$('#oe').value;$('#ef').hidden=!(n>1);if(!(n>1))return;
  if(f||!window._er||window._er.length!==n)window._er=emiRows(+$('#op').value||0,n,+$('#orr').value||0,+$('#ofe0').value||0);

  $('#et').innerHTML=`<table style="width:100%;font-size:12px;border-collapse:collapse"><tr><th>#</th><th>Principal</th><th>Interest</th><th>Fee</th><th>GST</th><th>Total</th></tr>${window._er.map((r,i)=>`<tr><td>${i+1}</td>${I('p',i,r.prin)}${I('i',i,r.int)}${I('f',i,r.fee)}${I('g',i,r.gst)}<td><b id="et${i}">${R(rowT(r))}</b></td></tr>`).join('')}</table><div class="m" id="etS"></div>`;emiEd(1)};

window.endRec=id=>{const x=S.fin.find(y=>y.id===id),to=addC(S.month,-1),r=doc(db,'users',S.me.uid,'finance',id);return to<x.from?deleteDoc(r):updateDoc(r,{to})};
const csv=rows=>'\ufeff'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
const dl=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)};
window.backup=()=>{const d=today();
  dl(`orders-${d}.csv`,csv([['Date','Item','Platform','Card','Whose card','Bought for','Normal','Paid','Cashback','Status','EMI months','EMI paid','Partially received','Due']].concat(S.orders.map(o=>[o.date,o.item,o.platform,o.cardName,nm(o.paidBy),nm(o.boughtFor),o.normal,o.paid,cb(o),STAT[o.status],o.emiMonths||0,o.emiDone||0,o.credit||0,pend(o)?Math.round(rem(o)):0]))));
  setTimeout(()=>dl(`finance-${d}.csv`,csv([['Month','Type','Description','Category','Amount','Basic','DA','HRA','Other allowances','Deductions','In salary PDF']].concat(S.fin.map(x=>[x.month||x.from,x.type,x.note,x.cat||'',x.amount,x.basic||'',x.da||'',x.hra||'',x.other||'',x.ded||'',x.inPdf==null?'':(x.inPdf?'Yes':'No')])))),900)};
window.togPdf=(id,v)=>updateDoc(doc(db,'users',S.me.uid,'finance',id),{inPdf:v});
window.delFin=id=>confirm('Delete?')&&deleteDoc(doc(db,'users',S.me.uid,'finance',id));

/* ---------- PDF (Print → Save as PDF; renders without any library) ---------- */
const ml=(a,b)=>{const r=[];for(let m=a;m<=b&&r.length<120;m=addC(m,1))r.push(m);return r};
const mname=m=>{const[y,mm]=m.split('-');return new Date(y,mm-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})};
const tbl=(h,rows,foot)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>${foot?`<tfoot><tr>${foot.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></tfoot>`:''}</table>`;
window.pset=k=>{const now=new Date(),cm=today().slice(0,7),y=now.getFullYear();let a,z=cm;
  if(k==='all'){const sl=$('#pt').value==='sal'?S.fin.filter(x=>x.isSalary||x.extra).map(x=>x.month):[...S.fin.map(x=>x.month||x.from),...S.orders.map(o=>(o.date||'').slice(0,7))];
    a=sl.filter(Boolean).sort()[0]||cm}
  else if(k==='fy'){const sy=now.getMonth()>=3?y:y-1;a=sy+'-04';z=(sy+1)+'-03'}
  else{a=y+'-01';z=y+'-12'}
  $('#pa').value=a;$('#pz').value=z};
window.makePdf=()=>{
  const t=$('#pt').value,a=$('#pa').value,b=$('#pz').value,me=S.me.uid;
  if(!a||!b||a>b)return alert('Choose valid months');
  const ms=ml(a,b),per=mname(a)+(a===b?'':' to '+mname(b));let title,body;
  if(t==='sal'){
    const rs=ms.map(m=>sal(m)).filter(Boolean);
    const ex=S.fin.filter(x=>x.type==='income'&&x.extra&&x.inPdf&&ms.includes(x.month)).sort((x,y)=>x.month.localeCompare(y.month));
    if(!rs.length&&!ex.length)return alert('No salary recorded for these months');
    const T=k=>rs.reduce((s,x)=>s+(x[k]||0),0),exT=ex.reduce((s,x)=>s+x.amount,0);
    title='Salary report – '+per;
    body=(rs.length?tbl(['Month','Basic','DA','HRA','Other allowances','Total','Deductions','Net salary'],rs.map(x=>[mname(x.month),R(x.basic),R(x.da),R(x.hra),R(x.other),R(x.gross),R(x.ded),R(x.amount)]),['Total',R(T('basic')),R(T('da')),R(T('hra')),R(T('other')),R(T('gross')),R(T('ded')),R(T('amount'))]):'')
      +(ex.length?'<h3 style="margin:14px 0 6px">Extra income</h3>'+tbl(['Month','Description','Amount'],ex.map(x=>[mname(x.month),x.note,R(x.amount)]),['Total','',R(exT)]):'')
      +(rs.length&&ex.length?`<h3 style="margin:14px 0 0">Total received (net salary + extra income): ${R(T('amount')+exT)}</h3>`:'');
  }else if(t==='exp'){
    const rows=[];
    S.fin.filter(x=>x.type==='expense'&&ms.includes(x.month)).forEach(x=>rows.push([x.month,x.cat||'Other',x.note||'Personal expenses',x.amount]));
    ms.forEach(m=>{recFor(m).forEach(x=>rows.push([m,x.cat||'Other',x.note+' (every month)',x.amount]));
      S.orders.filter(o=>o.boughtFor===me&&share(o,m)>0).forEach(o=>rows.push([m,'Card purchases',`${o.item} (${o.cardName})${mo(o)>1?' EMI':''}`,share(o,m)]))});
    if(!rows.length)return alert('No expenses in these months');
    rows.sort((x,y)=>x[0].localeCompare(y[0]));
    const by={};rows.forEach(r=>by[r[1]]=(by[r[1]]||0)+r[3]);
    title='Expense report – '+per;
    body=tbl(['Month','Category','Description','Amount'],rows.map(r=>[mname(r[0]),r[1],r[2],R(r[3])]),['Total','','',R(rows.reduce((s,r)=>s+r[3],0))])
      +'<h3 style="margin:14px 0 6px">Category-wise total</h3>'+tbl(['Category','Amount'],Object.entries(by).sort((x,y)=>y[1]-x[1]).map(([k,v])=>[k,R(v)]));
  }else{
    const fid=$('#pfr').value;if(!fid)return alert('Choose a friend');const pend_=$('#pst').value==='pend';
    const os=S.orders.filter(o=>(isG(fid)?o.boughtFor===fid:(o.paidBy===fid&&o.boughtFor===me)||(o.paidBy===me&&o.boughtFor===fid))
      &&o.date&&o.date.slice(0,7)>=a&&o.date.slice(0,7)<=b&&(!pend_||pend(o))).sort((x,y)=>x.date.localeCompare(y.date));
    if(!os.length)return alert('No orders found');
    const amt=o=>pend_?rem(o):owed(o),sg=o=>o.paidBy===me?1:-1;
    const tot=os.reduce((s,o)=>s+sg(o)*amt(o),0),who=isG(fid)?fid.slice(2):nm(fid);
    title='Account with '+who+' – '+per;
    body=tbl(['Date','Item','Card','Whose card','Status','Amount'],os.map(o=>[o.date,o.item+(mo(o)>1?` (EMI ${o.emiDone||0}/${mo(o)})`:''),o.cardName,o.paidBy===me?'From my card':'From their card',o.status==='Refund Received'?'Refund Received':o.status==='Cancelled'?'Cancelled (refund pending)':pend(o)?'Due':'Settled',R(amt(o))]),
      [tot>=0?'I will receive':'I have to pay','','','','',R(Math.abs(tot))]);
  }
  $('#pr').innerHTML=`<h2>${esc(title)}</h2><div class="pm">${esc(S.me.name)} • Generated: ${new Date().toLocaleDateString('en-IN')}</div>${body}`;
  setTimeout(()=>window.print(),150);
};

/* ---------- Manage Friends (Admin) ---------- */
function vAdmin(){
  if(!S.me.admin)return '';
  return `<div class="card"><b>Add new friend</b><input id="an" placeholder="Name"><input id="ae" type="email" placeholder="Gmail ID"><button class="pb" onclick="addFriend()">Add</button></div>
  ${S.allowed.map(a=>{const joined=S.users.some(u=>u.email===a.email);
    return `<div class="card row sp"><span><b>${esc(a.name)}</b><br><span class="m">${esc(a.email)} • ${a.active?(joined?'Joined':'Invited'):'Inactive'}</span></span>
    <button class="sm" onclick="toggleFriend('${esc(a.email)}',${!a.active})">${a.active?'Remove':'Activate'}</button></div>`}).join('')||'<p class="m">No friends yet</p>'}
  <p class="m">Removing a friend does not delete records; it only disables login.</p>`;
}
window.addFriend=async()=>{const n=$('#an').value.trim(),e=$('#ae').value.trim().toLowerCase();if(!n||!/^\S+@\S+\.\S+$/.test(e))return alert('Enter a name and a valid Gmail address');
  await setDoc(doc(db,'allowed_users',e),{name:n,email:e,active:true})};
window.toggleFriend=async(email,act)=>{
  if(!act){const u=S.users.find(x=>x.email===email);
    if(u&&S.orders.some(o=>(o.paidBy===u.uid||o.boughtFor===u.uid)&&pend(o)))return alert('Outstanding balances remain with them. Settle Cycle first.')}
  await updateDoc(doc(db,'allowed_users',email),{active:act})};
</script>
