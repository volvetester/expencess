<style>
:root{--bg:#f3f4f2;--c:#fff;--t:#16201e;--m:#68736f;--p:#0f766e;--r:#c62828;--g:#2e7d32;--b:#dde2df;--w:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0e1413;--c:#18211f;--t:#e8efed;--m:#91a09b;--b:#2a3532;--p:#2dd4bf}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,"Noto Sans Devanagari",sans-serif;padding-bottom:70px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;position:sticky;top:0;background:var(--bg);z-index:5}
header b{font-size:17px}main{padding:0 12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:0 0 10px}
.m{color:var(--m);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button,select,input{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 10px}
input,select{width:100%;margin:3px 0 8px}button{cursor:pointer}.pb{background:var(--p);color:#fff;border-color:var(--p)}
.sm{padding:5px 9px;font-size:13px}.bd{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--b)}
.Cancelled,.Refund{color:var(--r);border-color:var(--r)}.Delivered{color:var(--g);border-color:var(--g)}
.big{font-size:22px;font-weight:700}h3{margin:16px 2px 8px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;font-size:13px}nav .on{color:var(--p);font-weight:700;box-shadow:inset 0 3px var(--p)}
dialog{width:min(94vw,440px);border:1px solid var(--b);border-radius:14px;background:var(--bg);color:var(--t);max-height:90vh}
.c{text-align:center;padding:60px 20px}.neg{color:var(--r)}.pos{color:var(--g)}[hidden]{display:none!important}
#pr{display:none}
@media print{body{background:#fff;padding:0}body>*:not(#pr){display:none!important}#pr{display:block!important;background:#fff;color:#000;padding:12px;font-size:13px}
#pr h2{margin:0 0 4px}#pr .pm{color:#444;margin-bottom:10px}#pr table{width:100%;border-collapse:collapse}#pr th,#pr td{border:1px solid #999;padding:5px 7px;text-align:left}#pr thead th,#pr tfoot th{background:#eee}#pr thead{display:table-header-group}#pr tr{page-break-inside:avoid}}
</style>

<body>
<section id="login" class="c" hidden><h2>कार्ड हिसाब</h2><p class="m">सिर्फ़ जुड़े हुए लोगों के लिए</p><button class="pb" onclick="login()">Google से लॉगिन करें</button></section>
<section id="deny" class="c" hidden><h2>Access Denied</h2><p>यह ईमेल अनुमति सूची में नहीं है:<br><b id="denyMail"></b></p><button onclick="logout()">लॉगआउट</button></section>
<div id="main" hidden>
<header><b id="hi"></b><button class="sm" onclick="logout()">लॉगआउट</button></header>
<main id="app"></main>
<nav><button data-t="c" onclick="go('c')">Cards & Split</button><button data-t="s" onclick="go('s')">Statement</button><button data-t="f" onclick="go('f')">My Salary & Savings</button><button data-t="a" id="adminBtn" onclick="go('a')" hidden>Manage Friends</button></nav>
</div>
<dialog id="d"></dialog>
<div id="pr"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,query,where,onSnapshot,serverTimestamp,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== CONFIG: अपना Firebase config और Admin Gmail यहाँ भरें ===== */
const cfg={apiKey:"AIzaSyBY05UdaTavfUsUm-HDZ3YkWigv4GeHgLY",authDomain:"expense-tracker-16823.firebaseapp.com",projectId:"expense-tracker-16823",storageBucket:"expense-tracker-16823.firebasestorage.app",messagingSenderId:"1064956551398",appId:"1:1064956551398:web:bed8f5a69ef2c1e8249b27"};
const ADMIN="deepakmakandipur@gmail.com";
/* ================================================================ */

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
const S={me:null,users:[],cards:[],orders:[],fin:[],allowed:[],tab:'c',show:false,q:'',sc:'',sm:'',stv:'',_st:0,month:today().slice(0,7),cardF:''};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const isG=id=>String(id).startsWith('g:');
const nm=id=>isG(id)?id.slice(2)+' (निजी)':(S.users.find(u=>u.uid===id)?.name||'?');
const STAT={Ordered:'Ordered',Delivered:'Delivered',Cancelled:'Cancelled / Return (Refund Pending)','Refund Received':'Refund Received'};
const dead=o=>o.status==='Cancelled'||o.status==='Refund Received';
const cb=o=>dead(o)?0:(o.cbType==='%'?o.paid*o.cbVal/100:+o.cbVal||0);
const eff=o=>(o.cbMode==='instant'||o.cbCredited)?cb(o):0;
const chgRaw=o=>(o.fee||0)+(o.feeGst||0)+(o.intr||0);
const chg=o=>o.chgBy==='payer'?0:chgRaw(o);
const psum=o=>(o.pays||[]).reduce((s,p)=>s+p.amt,0);
const owed=o=>o.status==='Refund Received'?(o.dedBy==='payer'?0:Math.max(0,o.paid-(o.refundAmt??o.paid))+(o.clawAmt||0)):o.status==='Cancelled'?o.paid:o.paid-eff(o)+chg(o);
const mo=o=>o.emiMonths||1;
const sch=o=>Array.isArray(o.sched)&&mo(o)>1&&o.sched.length===mo(o)?o.sched:null;
const rd=x=>Math.round(x*100)/100,rowT=r=>(r.prin||0)+(r.int||0)+(r.fee||0)+(r.gst||0);
const pend=o=>dead(o)?Math.abs(owed(o)-psum(o))>0.5:(o.emiDone||0)<mo(o);
const addC=(c,n)=>{const[y,m]=c.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const cyc=(dt,day)=>{const d=new Date(dt);return addC(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),d.getDate()>day?1:0)};
const show=id=>['login','deny','main'].forEach(x=>$('#'+x).hidden=x!==id);

window.login=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert(e.message));
window.logout=()=>signOut(auth);
window.go=t=>{S.tab=t;render()};
window.closeD=()=>$('#d').close();
const dlg=h=>{$('#d').innerHTML=h;$('#d').showModal();if($('#oe')){if(window._eo)emiOpen(window._eo);else{window._er=null;emiCalc(0)}}};

onAuthStateChanged(auth,async u=>{
  if(!u){show('login');return}
  const em=(u.email||'').toLowerCase(),admin=em===ADMIN.toLowerCase();let ok=u.emailVerified,name=u.displayName||em;
  if(ok&&!admin){try{const a=await getDoc(doc(db,'allowed_users',em));ok=a.exists()&&a.data().active===true;if(ok)name=a.data().name}catch{ok=false}}
  if(!ok){$('#denyMail').textContent=em;show('deny');return}
  S.me={uid:u.uid,email:em,name,admin};
  await setDoc(doc(db,'users',u.uid),{uid:u.uid,name,email:em});
  $('#hi').textContent=name;$('#adminBtn').hidden=!admin;show('main');start();
});

function start(){
  const e=x=>console.error(x),m=S.me.uid;
  onSnapshot(collection(db,'users'),s=>{S.users=s.docs.map(d=>d.data());render(1)},e);
  onSnapshot(collection(db,'cards'),s=>{S.cards=s.docs.map(d=>({id:d.id,...d.data()}));render(1)},e);
  onSnapshot(query(collection(db,'orders'),where('participants','array-contains',m)),s=>{S.orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));render(1)},e);
  onSnapshot(collection(db,'users',m,'finance'),s=>{S.fin=s.docs.map(d=>({id:d.id,...d.data()}));render(1)},e);
  if(S.me.admin)onSnapshot(collection(db,'allowed_users'),s=>{S.allowed=s.docs.map(d=>d.data());render(1)},e);
}

function render(k){
  if(!S.me)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  const keep={},ae=document.activeElement,aid=ae&&ae.id;
  if(k===1)document.querySelectorAll('#app [id]').forEach(e=>{if('value' in e)keep[e.id]=e.value});
  $('#app').innerHTML=S.tab==='c'?vCards():S.tab==='s'?vStmt():S.tab==='f'?vFin():vAdmin();
  if(k===1){for(const id in keep){const e=document.getElementById(id);if(e&&e.value!==keep[id])e.value=keep[id]}
    if(aid&&keep[aid]!==undefined){const e=document.getElementById(aid);if(e){e.focus();try{e.setSelectionRange(ae.selectionStart,ae.selectionEnd)}catch{}}}}
}

/* ---------- Tab 1: Cards & Split ---------- */
function vCards(){
  const me=S.me.uid,G={};
  S.orders.filter(o=>o.paidBy!==o.boughtFor&&pend(o)).forEach(o=>{const k=[o.cardId,due(o),o.paidBy,o.boughtFor].join('|');(G[k]=G[k]||[]).push(o)});
  const td=new Date();td.setHours(0,0,0,0);
  const mk=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');
  const nx=d=>{const f=(y,m)=>new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()));let x=f(td.getFullYear(),td.getMonth());if(x<td)x=f(td.getFullYear(),td.getMonth()+1);return x};
  let banner='';
  [...new Set(Object.values(G).map(a=>a[0].cardId))].forEach(cid=>{const c=S.cards.find(x=>x.id===cid);if(!c)return;const n=nx(c.stmtDay),days=Math.round((n-td)/864e5);if(days>5)return;
    let give=0,get=0;Object.values(G).forEach(a=>{const o=a[0];if(o.cardId!==cid||due(o)!==mk(n))return;const t=a.reduce((s,x)=>s+due1(x),0);((o.boughtFor===me)===(t>=0))?give+=Math.abs(t):get+=Math.abs(t)});
    if(give||get)banner+=`<div class="card" style="border-color:var(--w)">⏰ ${esc(c.name)} का बिल ${days===0?'आज':days+' दिन में'} (${c.stmtDay} तारीख़)${give?`<br>देने हैं: <b>${R(give)}</b>`:''}${get?`<br>लेने हैं: <b>${R(get)}</b>`:''}</div>`});
  const groups=Object.values(G).map(a=>{
    const o=a[0],t=Math.round(a.reduce((s,x)=>s+due1(x),0)*100)/100,iOwe=(o.boughtFor===me)===(t>=0),at=Math.abs(t),oth=o.paidBy===me?o.boughtFor:o.paidBy,dc=due(o);
    const txt=`${o.cardName} – ${o.stmtDay} तारीख़ के बिल (${dc}) से पहले ${nm(oth)} ${iOwe?'को '+R(at)+' देने हैं':'से '+R(at)+' लेने हैं'}${t<0?' (रिफंड की वापसी)':''}`;
    const wa=encodeURIComponent(`हिसाब – ${o.cardName} (${dc} बिल)\n`+a.map(x=>`• ${x.item}${mo(x)>1?` (EMI ${(x.emiDone||0)+1}/${mo(x)})`:''}: ${R(due1(x))}`).join('\n')+`\nकुल: ${R(at)}`);
    return `<div class="card"><div>${esc(txt)}</div><div class="m">${a.length} ऑर्डर</div><div class="row" style="margin-top:8px">
      <button class="pb sm" onclick="payGroup('${a.map(x=>x.id).join(',')}',${t},true)">Settle Cycle</button>
      <button class="sm" onclick="payGroup('${a.map(x=>x.id).join(',')}',${t})">आंशिक भुगतान</button>
      <a href="https://wa.me/?text=${wa}" target="_blank" rel="noopener"><button class="sm">Share on WhatsApp</button></a></div></div>`;
  }).join('')||'<p class="m">कोई बकाया नहीं</p>';
  const pcb=S.orders.filter(o=>o.paidBy===me&&o.cbMode==='later'&&!o.cbCredited&&!dead(o)).reduce((s,o)=>s+cb(o),0);
  const myCards=S.cards.filter(c=>c.ownerUid===me);
  return `<div class="row" style="margin-bottom:10px"><button class="pb" onclick="orderForm()">+ नया ऑर्डर</button><button onclick="cardForm()">+ कार्ड</button><button onclick="chargeForm()">+ बैंक चार्ज</button></div>

window.saveOrder=async()=>{

  const paidBy=c.ownerUid;let bf=g('ob');

  if(![paidBy,bf].includes(S.me.uid))return alert('आप इस ऑर्डर में शामिल होने चाहिए');
  const dt=g('od'),em=Math.max(0,Math.floor(+g('oe')||0));
  await addDoc(collection(db,'orders'),{item:g('oi').trim(),platform:g('opl'),cardId:c.id,cardName:c.name,stmtDay:c.stmtDay,paidBy,boughtFor:bf,
    participants:[...new Set([paidBy,bf].filter(x=>!isG(x)))],normal:+g('on')||paid,paid,cbType:g('ot'),cbVal:+g('ov')||0,cbMode:g('om'),cbCredited:false,

};

const sdiff=()=>{if(S.stv==='')return '<span class="m">स्टेटमेंट का कुल भरें</span>';const d=Math.round((+S.stv-S._st)*100)/100;
  return Math.abs(d)<1?'<b class="pos">✓ मिल गया</b>':`<b class="neg">फ़र्क ${R(Math.abs(d))}</b> <span class="m">(स्टेटमेंट ${d>0?'ज़्यादा':'कम'}: कोई ऑर्डर छूटा या कैशबैक/फ़ीस का असर हो सकता है)</span>`};
window.stIn=v=>{S.stv=v;$('#sdiff').innerHTML=sdiff()};
function vStmt(){
  const me=S.me.uid,mine=S.cards.filter(c=>c.ownerUid===me);
  if(!mine.length)return '<p class="m">पहले अपना कार्ड जोड़ें (Cards & Split → + कार्ड)</p>';
  const c=mine.find(x=>x.id===S.sc)||mine[0];S.sc=c.id;
  const m=S.sm||cyc(today(),c.stmtDay),L=[];
  S.orders.filter(o=>o.cardId===c.id).forEach(o=>{const k=mdiff(m,o.cycle);
    if(k>=0&&k<mo(o)){const sc=sch(o);if(sc)L.push({o,amt:rowT(sc[k]),lab:` (EMI ${k+1}/${mo(o)}${(sc[k].fee||sc[k].gst)?' • फीस/GST सहित':''})`});else{L.push({o,amt:(o.paid+(o.intr||0))/mo(o),lab:mo(o)>1?` (EMI ${k+1}/${mo(o)})`:''});if(k===0&&(o.fee||0)+(o.feeGst||0)>0)L.push({o,amt:(o.fee||0)+(o.feeGst||0),lab:' (प्रोसेसिंग फीस + GST)'})}}
    if(o.status==='Refund Received'){const rf=o.refundAmt??o.paid;if(rf>0&&cyc(o.rfDate||o.date,c.stmtDay)===m)L.push({o,amt:-rf,lab:' (रिफंड क्रेडिट)'})}});
  const tot=L.reduce((s,x)=>s+x.amt,0),by={};L.forEach(x=>{const k=x.o.boughtFor===me?'मेरा अपना':nm(x.o.boughtFor);by[k]=(by[k]||0)+x.amt});
  S._st=tot;
  return `<select onchange="S.sc=this.value;S.sm='';render()">${mine.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
  <input type="month" value="${m}" onchange="S.sm=this.value;render()">
  <div class="card"><div class="m">${esc(c.name)} • ${m} का बिल (स्टेटमेंट तारीख़ ${c.stmtDay})</div><div class="big">${R(tot)}</div><div class="m">ऐप के हिसाब से स्टेटमेंट का कुल</div>
  ${Object.entries(by).map(([k,v])=>`<div class="row sp"><span>${esc(k)}</span><b>${R(v)}</b></div>`).join('')}</div>
  <div class="card"><b>बैंक स्टेटमेंट से मिलान</b><input type="number" inputmode="decimal" placeholder="स्टेटमेंट का कुल (₹)" value="${esc(S.stv)}" oninput="stIn(this.value)"><div id="sdiff">${sdiff()}</div></div>
  ${emiPanel(c,m)}
  <div class="m" style="margin:0 2px 8px">कैशबैक राशि यहाँ शामिल नहीं है (बैंक उसे अलग से क्रेडिट करता है)।</div>
  ${L.sort((x,y)=>x.o.date.localeCompare(y.o.date)).map(x=>`<div class="card row sp"><span>${esc(x.o.item)}${x.lab} <span class="bd ${x.o.status==='Refund Received'?'Refund':x.o.status}">${STAT[x.o.status]}</span><br><span class="m">${x.o.date} • ${esc(nm(x.o.boughtFor))}</span></span><b class="${x.amt<0?'pos':''}">${R(x.amt)}</b></div>`).join('')||'<p class="m">इस बिल में कोई एंट्री नहीं</p>'}`;
}

window.togPdf=(id,v)=>updateDoc(doc(db,'users',S.me.uid,'finance',id),{inPdf:v});
window.delFin=id=>confirm('हटाएँ?')&&deleteDoc(doc(db,'users',S.me.uid,'finance',id));

/* ---------- PDF (Print → Save as PDF; हिंदी बिना किसी लाइब्रेरी के सही दिखती है) ---------- */
const ml=(a,b)=>{const r=[];for(let m=a;m<=b&&r.length<120;m=addC(m,1))r.push(m);return r};
const mname=m=>{const[y,mm]=m.split('-');return new Date(y,mm-1,1).toLocaleDateString('hi-IN',{month:'long',year:'numeric'})};
const tbl=(h,rows,foot)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>${foot?`<tfoot><tr>${foot.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></tfoot>`:''}</table>`;
window.pset=k=>{const now=new Date(),cm=today().slice(0,7),y=now.getFullYear();let a,z=cm;
  if(k==='all'){const sl=$('#pt').value==='sal'?S.fin.filter(x=>x.isSalary||x.extra).map(x=>x.month):[...S.fin.map(x=>x.month||x.from),...S.orders.map(o=>(o.date||'').slice(0,7))];
    a=sl.filter(Boolean).sort()[0]||cm}
  else if(k==='fy'){const sy=now.getMonth()>=3?y:y-1;a=sy+'-04';z=(sy+1)+'-03'}
  else{a=y+'-01';z=y+'-12'}
  $('#pa').value=a;$('#pz').value=z};
window.makePdf=()=>{
  const t=$('#pt').value,a=$('#pa').value,b=$('#pz').value,me=S.me.uid;
  if(!a||!b||a>b)return alert('सही महीने चुनें');
  const ms=ml(a,b),per=mname(a)+(a===b?'':' से '+mname(b));let title,body;
  if(t==='sal'){
    const rs=ms.map(m=>sal(m)).filter(Boolean);
    const ex=S.fin.filter(x=>x.type==='income'&&x.extra&&x.inPdf&&ms.includes(x.month)).sort((x,y)=>x.month.localeCompare(y.month));
    if(!rs.length&&!ex.length)return alert('इन महीनों का कोई वेतन दर्ज नहीं है');
    const T=k=>rs.reduce((s,x)=>s+(x[k]||0),0),exT=ex.reduce((s,x)=>s+x.amount,0);
    title='सैलरी रिपोर्ट – '+per;
    body=(rs.length?tbl(['महीना','बेसिक','DA','HRA','अन्य भत्ते','कुल','कटौती','नेट सैलरी'],rs.map(x=>[mname(x.month),R(x.basic),R(x.da),R(x.hra),R(x.other),R(x.gross),R(x.ded),R(x.amount)]),['कुल',R(T('basic')),R(T('da')),R(T('hra')),R(T('other')),R(T('gross')),R(T('ded')),R(T('amount'))]):'')
      +(ex.length?'<h3 style="margin:14px 0 6px">अतिरिक्त आय</h3>'+tbl(['महीना','विवरण','राशि'],ex.map(x=>[mname(x.month),x.note,R(x.amount)]),['कुल','',R(exT)]):'')
      +(rs.length&&ex.length?`<h3 style="margin:14px 0 0">कुल प्राप्ति (नेट सैलरी + अतिरिक्त आय): ${R(T('amount')+exT)}</h3>`:'');
  }else if(t==='exp'){
    const rows=[];
    S.fin.filter(x=>x.type==='expense'&&ms.includes(x.month)).forEach(x=>rows.push([x.month,x.cat||'अन्य',x.note||'निजी खर्च',x.amount]));
    ms.forEach(m=>{recFor(m).forEach(x=>rows.push([m,x.cat||'अन्य',x.note+' (हर माह)',x.amount]));
      S.orders.filter(o=>o.boughtFor===me&&share(o,m)>0).forEach(o=>rows.push([m,'कार्ड खरीदारी',`${o.item} (${o.cardName})${mo(o)>1?' EMI':''}`,share(o,m)]))});
    if(!rows.length)return alert('इन महीनों में कोई खर्च नहीं है');
    rows.sort((x,y)=>x[0].localeCompare(y[0]));
    const by={};rows.forEach(r=>by[r[1]]=(by[r[1]]||0)+r[3]);
    title='खर्च रिपोर्ट – '+per;
    body=tbl(['महीना','श्रेणी','विवरण','राशि'],rows.map(r=>[mname(r[0]),r[1],r[2],R(r[3])]),['कुल','','',R(rows.reduce((s,r)=>s+r[3],0))])
      +'<h3 style="margin:14px 0 6px">श्रेणी-वार जोड़</h3>'+tbl(['श्रेणी','राशि'],Object.entries(by).sort((x,y)=>y[1]-x[1]).map(([k,v])=>[k,R(v)]));
  }else{
    const fid=$('#pfr').value;if(!fid)return alert('दोस्त चुनें');const pend_=$('#pst').value==='pend';
    const os=S.orders.filter(o=>(isG(fid)?o.boughtFor===fid:(o.paidBy===fid&&o.boughtFor===me)||(o.paidBy===me&&o.boughtFor===fid))
      &&o.date&&o.date.slice(0,7)>=a&&o.date.slice(0,7)<=b&&(!pend_||pend(o))).sort((x,y)=>x.date.localeCompare(y.date));
    if(!os.length)return alert('कोई ऑर्डर नहीं मिला');
    const amt=o=>pend_?rem(o):owed(o),sg=o=>o.paidBy===me?1:-1;
    const tot=os.reduce((s,o)=>s+sg(o)*amt(o),0),who=isG(fid)?fid.slice(2):nm(fid);
    title=who+' के साथ हिसाब – '+per;
    body=tbl(['तारीख़','सामान','कार्ड','किसके कार्ड से','स्थिति','राशि'],os.map(o=>[o.date,o.item+(mo(o)>1?` (EMI ${o.emiDone||0}/${mo(o)})`:''),o.cardName,o.paidBy===me?'मेरे कार्ड से':'उनके कार्ड से',o.status==='Refund Received'?'Refund Received':o.status==='Cancelled'?'Cancelled (रिफंड बाकी)':pend(o)?'बकाया':'Settled',R(amt(o))]),
      [tot>=0?'मुझे लेने हैं':'मुझे देने हैं','','','','',R(Math.abs(tot))]);
  }
  $('#pr').innerHTML=`<h2>${esc(title)}</h2><div class="pm">${esc(S.me.name)} • बनाया: ${new Date().toLocaleDateString('hi-IN')}</div>${body}`;
  setTimeout(()=>window.print(),150);
};

/* ---------- Manage Friends (Admin) ---------- */
function vAdmin(){
  if(!S.me.admin)return '';
  return `<div class="card"><b>नया दोस्त जोड़ें</b><input id="an" placeholder="नाम"><input id="ae" type="email" placeholder="Gmail ID"><button class="pb" onclick="addFriend()">जोड़ें</button></div>
  ${S.allowed.map(a=>{const joined=S.users.some(u=>u.email===a.email);
    return `<div class="card row sp"><span><b>${esc(a.name)}</b><br><span class="m">${esc(a.email)} • ${a.active?(joined?'Joined':'Invited'):'Inactive'}</span></span>
    <button class="sm" onclick="toggleFriend('${esc(a.email)}',${!a.active})">${a.active?'Remove':'Activate'}</button></div>`}).join('')||'<p class="m">अभी कोई दोस्त नहीं</p>'}
  <p class="m">Remove करने पर हिसाब डिलीट नहीं होता, सिर्फ़ लॉगिन बंद होता है।</p>`;
}
window.addFriend=async()=>{const n=$('#an').value.trim(),e=$('#ae').value.trim().toLowerCase();if(!n||!/^\S+@\S+\.\S+$/.test(e))return alert('नाम और सही Gmail भरें');
  await setDoc(doc(db,'allowed_users',e),{name:n,email:e,active:true})};
window.toggleFriend=async(email,act)=>{
  if(!act){const u=S.users.find(x=>x.email===email);
    if(u&&S.orders.some(o=>(o.paidBy===u.uid||o.boughtFor===u.uid)&&pend(o)))return alert('इनके साथ बकाया हिसाब बचा है। पहले Settle Cycle करें।')}
  await updateDoc(doc(db,'allowed_users',email),{active:act})};
</script>
